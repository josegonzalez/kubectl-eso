apiVersion: krew.googlecontainertools.github.com/v1alpha2
kind: Plugin
metadata:
  name: eso
spec:
  version: {{ .TagName }}
  homepage: https://github.com/josegonzalez/kubectl-eso
  shortDescription: Manage Kubernetes Secrets with External Secrets Operator
  description: |
    A kubectl plugin for managing Kubernetes Secrets in the context of
    the External Secrets Operator (ESO). Supports annotating secrets for
    ESO adoption, listing and inspecting ExternalSecrets, SecretStores,
    and ClusterSecretStores, viewing secret data with optional base64
    decoding, and forcing re-sync of ExternalSecrets.
  platforms:
    - selector:
        matchLabels:
          os: darwin
          arch: amd64
      {{addURIAndSha "https://github.com/josegonzalez/kubectl-eso/releases/download/{{ .TagName }}/kubectl-eso_{{ .TagName }}_darwin_amd64.tar.gz" .TagName | indent 6 }}
      bin: kubectl-eso
      files:
        - from: kubectl-eso
          to: .
        - from: LICENSE
          to: .
    - selector:
        matchLabels:
          os: darwin
          arch: arm64
      {{addURIAndSha "https://github.com/josegonzalez/kubectl-eso/releases/download/{{ .TagName }}/kubectl-eso_{{ .TagName }}_darwin_arm64.tar.gz" .TagName | indent 6 }}
      bin: kubectl-eso
      files:
        - from: kubectl-eso
          to: .
        - from: LICENSE
          to: .
    - selector:
        matchLabels:
          os: linux
          arch: amd64
      {{addURIAndSha "https://github.com/josegonzalez/kubectl-eso/releases/download/{{ .TagName }}/kubectl-eso_{{ .TagName }}_linux_amd64.tar.gz" .TagName | indent 6 }}
      bin: kubectl-eso
      files:
        - from: kubectl-eso
          to: .
        - from: LICENSE
          to: .
    - selector:
        matchLabels:
          os: linux
          arch: arm64
      {{addURIAndSha "https://github.com/josegonzalez/kubectl-eso/releases/download/{{ .TagName }}/kubectl-eso_{{ .TagName }}_linux_arm64.tar.gz" .TagName | indent 6 }}
      bin: kubectl-eso
      files:
        - from: kubectl-eso
          to: .
        - from: LICENSE
          to: .
    - selector:
        matchLabels:
          os: windows
          arch: amd64
      {{addURIAndSha "https://github.com/josegonzalez/kubectl-eso/releases/download/{{ .TagName }}/kubectl-eso_{{ .TagName }}_windows_amd64.zip" .TagName | indent 6 }}
      bin: kubectl-eso.exe
      files:
        - from: kubectl-eso.exe
          to: .
        - from: LICENSE
          to: .
    - selector:
        matchLabels:
          os: windows
          arch: arm64
      {{addURIAndSha "https://github.com/josegonzalez/kubectl-eso/releases/download/{{ .TagName }}/kubectl-eso_{{ .TagName }}_windows_arm64.zip" .TagName | indent 6 }}
      bin: kubectl-eso.exe
      files:
        - from: kubectl-eso.exe
          to: .
        - from: LICENSE
          to: .
